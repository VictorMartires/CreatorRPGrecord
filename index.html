<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ficha de RPG</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="topbar no-print">
  <div class="brand">
    <h1>Ficha de RPG</h1>
    <span>D&amp;D 5e &amp; Ordem Paranormal</span>
  </div>
  <nav>
    <span class="user-chip hidden" id="user-chip"></span>
    <button class="btn small hidden" id="btn-logout" onclick="logout()">Trocar usuário</button>
    <button class="btn nav-btn" id="btn-home" onclick="goHome()">Início</button>
    <button class="btn nav-btn" id="btn-bib" onclick="openBiblioteca()">Fichas dos Jogadores</button>
    <button class="btn accent" id="btn-new" onclick="newCharacter()">+ Nova Ficha</button>
    <button class="btn" id="btn-print" onclick="printSheet()">Imprimir / PDF</button>
    <button class="btn" id="btn-export" onclick="exportActive()">Exportar JSON</button>
    <label class="btn filebtn">Importar&nbsp;JSON
      <input type="file" id="import-file" accept=".json,application/json" hidden onchange="importJSON(this)">
    </label>
  </nav>
</header>

<main>
  <section id="screen-login" class="screen hidden"></section>
  <section id="screen-home" class="screen hidden"></section>
  <section id="screen-create" class="screen hidden"></section>
  <section id="screen-sheet" class="screen hidden"></section>
  <section id="screen-biblioteca" class="screen hidden"></section>
</main>

<div id="modal-root"></div>
<div id="toast" class="toast hidden"></div>

<script src="js/data.js"></script>
<script src="js/core.js"></script>
<script src="js/storage.js"></script>
<script src="js/export.js"></script>
<script src="js/render.js"></script>
<script src="js/app.js"></script>
</body>
</html>
